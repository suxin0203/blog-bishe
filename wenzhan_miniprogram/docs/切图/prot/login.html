<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录绑定 - 文栈博客小程序原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{width:430px;height:932px;margin:0;overflow:hidden;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.safe-top{height:54px}.screen{width:430px;height:932px;overflow:hidden;background:#f6f7f9}</style>
</head>
<body>
  <div class="screen relative">
    <div class="absolute inset-0 bg-gradient-to-br from-emerald-500 via-teal-600 to-slate-900"></div>
    <div class="safe-top relative"></div>
    <main class="relative px-7 pt-16 text-white">
      <div class="w-24 h-24 rounded-[32px] bg-white/20 backdrop-blur flex items-center justify-center text-3xl font-black">WZ</div>
      <h1 class="mt-8 text-4xl font-black leading-tight">欢迎登录<br/>文栈博客</h1>
      <p class="mt-4 text-white/70 leading-relaxed">使用微信身份快速登录，也可以绑定已有 Web 端账号，跨端同步收藏、积分和订单。</p>
      <section class="mt-12 bg-white rounded-[32px] p-6 text-gray-900 shadow-2xl">
        <button class="w-full h-14 rounded-2xl bg-emerald-600 text-white font-bold text-lg">微信一键登录</button>
        <div class="mt-5 grid grid-cols-2 gap-3"><button class="h-12 rounded-2xl bg-gray-100 font-semibold text-gray-700">绑定已有账号</button><button class="h-12 rounded-2xl bg-gray-100 font-semibold text-gray-700">注册新账号</button></div>
        <div class="mt-6 space-y-3">
          <div class="h-12 rounded-2xl bg-gray-50 px-4 flex items-center text-sm text-gray-400">用户名 / 邮箱</div>
          <div class="h-12 rounded-2xl bg-gray-50 px-4 flex items-center text-sm text-gray-400">密码</div>
        </div>
        <p class="mt-5 text-xs text-gray-400 leading-relaxed">登录即表示同意用户协议。未绑定用户将进入注册或绑定流程，系统会复用现有 JWT 登录态。</p>
      </section>
    </main>
  </div>
</body>
</html>
