<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>积分 - 文栈博客小程序原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{width:430px;height:932px;margin:0;overflow:hidden;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.safe-top{height:54px}.screen{width:430px;height:932px;position:relative;overflow:hidden;background:#f6f7f9}.content{height:calc(932px - 54px - 84px);overflow-y:auto;padding-bottom:20px}</style>
</head>
<body>
  <div class="screen">
    <div class="safe-top bg-gradient-to-br from-emerald-500 to-teal-700"></div>
    <header class="bg-gradient-to-br from-emerald-500 to-teal-700 px-5 pb-7 text-white rounded-b-[32px]">
      <div class="flex justify-between items-center"><h1 class="text-2xl font-bold">我的积分</h1><span class="text-sm opacity-80">规则</span></div>
      <div class="mt-6"><p class="text-sm opacity-80">当前可用积分</p><div class="mt-2 text-5xl font-black">1,280</div><p class="mt-3 text-sm opacity-80">今日登录积分已领取 +5</p></div>
    </header>
    <main class="content px-5 -mt-5">
      <section class="grid grid-cols-3 gap-3">
        <div class="bg-white rounded-2xl p-4 shadow-sm text-center"><div class="text-xl font-bold text-emerald-600">+5</div><p class="text-xs text-gray-400 mt-1">每日登录</p></div>
        <div class="bg-white rounded-2xl p-4 shadow-sm text-center"><div class="text-xl font-bold text-blue-600">+10</div><p class="text-xs text-gray-400 mt-1">发布文章</p></div>
        <div class="bg-white rounded-2xl p-4 shadow-sm text-center"><div class="text-xl font-bold text-orange-600">+1</div><p class="text-xs text-gray-400 mt-1">文章获赞</p></div>
      </section>
      <section class="mt-6">
        <div class="flex justify-between items-center mb-3"><h2 class="font-bold text-gray-900">快捷入口</h2></div>
        <div class="grid grid-cols-3 gap-3">
          <div class="bg-white rounded-[22px] p-4 shadow-sm text-center"><div class="text-2xl">流水</div><p class="text-xs text-gray-500 mt-2">积分流水</p></div>
          <div class="bg-white rounded-[22px] p-4 shadow-sm text-center"><div class="text-2xl">商城</div><p class="text-xs text-gray-500 mt-2">积分商城</p></div>
          <div class="bg-white rounded-[22px] p-4 shadow-sm text-center"><div class="text-2xl">订单</div><p class="text-xs text-gray-500 mt-2">兑换订单</p></div>
        </div>
      </section>
      <section class="mt-6">
        <div class="flex justify-between items-center mb-3"><h2 class="font-bold text-gray-900">最近记录</h2><span class="text-xs text-emerald-600">全部</span></div>
        <div class="space-y-3">
          <div class="bg-white rounded-2xl p-4 shadow-sm flex justify-between"><div><h3 class="font-semibold text-gray-900">每日登录</h3><p class="text-xs text-gray-400 mt-1">2026-05-13 09:20</p></div><span class="font-bold text-emerald-600">+5</span></div>
          <div class="bg-white rounded-2xl p-4 shadow-sm flex justify-between"><div><h3 class="font-semibold text-gray-900">文章获赞《扫码登录设计》</h3><p class="text-xs text-gray-400 mt-1">2026-05-12 18:41</p></div><span class="font-bold text-emerald-600">+1</span></div>
          <div class="bg-white rounded-2xl p-4 shadow-sm flex justify-between"><div><h3 class="font-semibold text-gray-900">积分兑换</h3><p class="text-xs text-gray-400 mt-1">2026-05-11 20:10</p></div><span class="font-bold text-red-500">-120</span></div>
        </div>
      </section>
    </main>
    <nav class="absolute bottom-0 left-0 right-0 h-[84px] bg-white border-t border-gray-100 flex justify-around pt-3 text-xs"><div class="text-gray-400 text-center"><div class="text-lg">首页</div><span>首页</span></div><div class="text-gray-400 text-center"><div class="text-lg">类目</div><span>分类</span></div><div class="text-emerald-600 font-semibold text-center"><div class="text-lg">积分</div><span>积分</span></div><div class="text-gray-400 text-center"><div class="text-lg">我的</div><span>我的</span></div></nav>
  </div>
</body>
</html>
